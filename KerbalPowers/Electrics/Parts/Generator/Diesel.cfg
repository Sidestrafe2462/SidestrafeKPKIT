PART
{
	// --- general parameters ---
	name = kpdDiesel
	module = Part
	author = Spartwo
	
	// --- asset parameters ---
	MODEL
	{
		model = KerbalPowers/Electrics/Parts/Generator/diesel
		scale = 1, 1, 1
	}
	rescaleFactor = 1
	
	// --- node definitions ---
	node_attach = 0, 0, 0, 0, -1, 0, 2
	node_stack_top = 0, 0.7, 2.1, 0, 0, 1, 2
	node_stack_bottom = 0, 0.7, -2.1, 0, 0, -1, 2
	
	// --- editor parameters ---
	TechRequired = specializedElectrics //specializedElectrics
	entryCost = 12200
	cost = 4500
	category = Electrical //Electrical
	subcategory = 0
	
	
	attachRules = 1,1,1,1,0 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	bulkheadProfiles = srf, size1p5
	
	
	title = #LOC_KPDynamics_Diesel_title
	manufacturer = #LOC_KPDynamics_Gladia_title
	description = #LOC_KPDynamics_Diesel_description
	tags = #autoLOC_500651 //#autoLOC_500651 = array bank charge convert e/c elect energ pack power volt watt

	// --- standard part parameters ---
	mass = 3
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 2000 // = 3000
	

	MODULE
	{
		 name = ModuleResourceConverter
		 ConverterName = #LOC_KPDynamics_Diesel_Name
		 StartActionName = #LOC_KPDynamics_Diesel_Start
		 StopActionName = #LOC_KPDynamics_Diesel_Stop
		 ToggleActionName = #LOC_KPDynamics_Diesel_Toggle
		 FillAmount = 0.95
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = false


		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		Specialty = Engineer
		EfficiencyBonus = 1

		INPUT_RESOURCE
		{
			ResourceName = LiquidFuel
			Ratio = 0.3037
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = IntakeAir
			ignoreForIsp = True
			Ratio = 30
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 100
			DumpExcess = false
		}
	}
	
	MODULE
	{
		name = ModuleCoreHeat
		CoreTempGoal = 750					//Internal temp goal - we don't transfer till we hit this point
		CoreToPartRatio = 0.1				//Scale back cooling if the part is this % of core temp
		CoreTempGoalAdjustment = 0			//Dynamic goal adjustment
		CoreEnergyMultiplier = 0.1			//What percentage of our core energy do we transfer to the part
		HeatRadiantMultiplier = 0.05		//If the core is hotter, how much heat radiates?
		CoolingRadiantMultiplier = 0		//If the core is colder, how much radiates?
		HeatTransferMultiplier = 0			//If the part is hotter, how much heat transfers in?
		CoolantTransferMultiplier = 0.01	//If the part is colder, how much of our energy can we transfer?
		radiatorCoolingFactor = 1			//How much energy we pull from core with an active radiator?  >= 1
		radiatorHeatingFactor = 0.05		//How much energy we push to the active radiator
		MaxCalculationWarp = 1000			//Based on how dramatic the changes are, this is the max rate of change
		CoreShutdownTemp = 4000				//At what core temperature do we shut down all generators on this part?
		MaxCoolant = 500					//Maximum amount of radiator capacity we can consume - 50 = 1 small
	}
	
	RESOURCE
	{
		name = ElectricCharge
		amount = 125
		maxAmount = 125
	}
	
	MODULE
	{
		name = ModulePartVariants
		baseVariant = Bare
		useMultipleDragCubes = True
		VARIANT
		{
			name = Bare
			displayName = #LOC_KPDynamics_GeneratorVariant_Bare
			themeName = Bare
			primaryColor = #999999
			secondaryColor = #999999
			GAMEOBJECTS
			{
				DieselTube.collider = false
				TurbineTube.collider = false
				ReactorTube.collider = false
				Shroud = false
				ShroudIntake = false 
				ShroudExhaust = false
				RingTop = false
				RingBottom = false
				BaseUnder = true
			}
		}
		VARIANT
		{
			name = Shrouded
			displayName = #LOC_KPDynamics_GeneratorVariant_Shrouded
			themeName = Shrouded
			primaryColor = #999999
			secondaryColor = #999999
			GAMEOBJECTS
			{
				DieselTube.collider = true
				TurbineTube.collider = true
				ReactorTube.collider = true
				Shroud = true
				ShroudIntake = true 
				ShroudExhaust = true
				RingTop = true
				RingBottom = true
				RingTop1 = true
				RingBottom1 = true
				BaseUnder = false
			}
		}
	}
}
