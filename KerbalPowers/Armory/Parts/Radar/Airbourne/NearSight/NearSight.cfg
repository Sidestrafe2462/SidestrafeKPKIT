PART
{
	// --- general parameters ---
	name = kpaNearSight
	module = Part
	author = Spartwo

	// --- asset parameters ---
	mesh = nearSight
	
	rescaleFactor = 1

	// --- node definitions ---
	node_attach = 0.0, 0, 0, 0, -1, 0, 0
	node_stack_bottom = 0.0, -0.224185, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_top =  0.0, 0.224185, 0.0, 0.0, 1.0, 0.0, 1

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 10000
	cost = 2000
	category = none
	bdacategory = Radars
	subcategory = 0
	
	
	attachRules = 1,1,1,1,0 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	bulkheadProfiles = size1, srf
	
	title = #LOC_KPDynamics_NearSight_title
	manufacturer = #LOC_Onicron_title
	description = #LOC_KPDynamics_NearSight_description
	tags = #loc_BDArmory_part_bdRadome1_Gnd_tags 
	
	// --- standard part parameters ---
	mass = 0.113
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 15
	maxTemp = 3600

	MODULE
	{
  		name = ModuleRadar

		// -- Section: General Configuration --
		radarName = #LOC_KPDynamics_NearSight_radar	
		rwrThreatType = 1				// IMPORTANT, please set correctly:
								// 0 = SAM site radar
								// 1 = Fighter radar (airborne)
								// 2 = AWACS radar (airborne)
								// 3, 4 = ACTIVE MISSILE (DO NOT USE UNLESS YOU KNOW WHAT YOU'RE DOING!
								// 5 = Detection radar (ground/ship based)
								// 6 = SONAR (ship/submarine based)
		
		radarTransformName = Scan
		//turretID = 0					// if needed
		resourceDrain = 1				// change to higher values for more capable radars, e.g AESA

		// -- Section: Capabilities --
		omnidirectional = false				// false: boresight scan radar
		directionalFieldOfView = 120			// for omni and boresight
		//boresightFOV = 10				// for boresight only
		//scanRotationSpeed = 0				// degress per second
		showDirectionWhileScan = true			

		canScan = true					// scanning/detecting targets (volume search)

		elevationFOV = -60, 15

		canLock = true					// locking/tracking targets (fire control)
  		canTrackWhileScan = true			// continue scanning while tracking a locked target
  		canRecieveRadarData = true			// can work as passive data receiver (NOTE THE SPELLING! [SIC])

 		multiLockFOV = 120				// only relevant if canLock
        	maxLocks = 3

		radarGroundClutterFactor = 4			// how much is the radar efficiency reduced to by ground clutter/look-down?

		radarDetectionCurve
		{
		  //    key = distance	rcs
			key = 0 0 0.2666667 0.2666667
			key = 6 1.6 0.2948718 0.2948718
			key = 32 10 0.3073718 0.3073718
			key = 80 24 0.2916667 0.2916667
		}
    		radarLockTrackCurve
    		{
			key = 0 0 2 2
			key = 6 12 2 2
			key = 16 32 2 2
			key = 24 48 2 2
    		}
	}
	
	MODULE
	{
		name = ModuleJettison
		jettisonName = TopCap
		bottomNodeName = node_stack_top
		isFairing = false
		stagingEnabled = false
		jettisonForce = 0
	}

	MODULE
	{
		name = ModuleJettison
		jettisonName = BottomCap
		bottomNodeName = node_stack_bottom
		isFairing = false
		stagingEnabled = false
		jettisonForce = 0
	}
}
