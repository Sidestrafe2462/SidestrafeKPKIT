// MechaGrail ruleset.
// Edited live — no recompile. KSP reloads this on a database reload (F11 in
// some setups) or on game restart. If a league changes a number mid-season,
// this file is the only thing that ships.

MECHAGRAIL_RULES
{
    maxParts = 200
    maxReactionWheels = 1
    allowRcs = false
    allowTurrets = false
    gunCostPerTon = 300
    cmPerBoxCapacity = 42
    cmBoxHardCap = 12

    // Missile-budget value per munition class, before class multipliers.
    MISSILE_COST
    {
        aa           = 1.0
        aa_cluster   = 3.0
        ag_guided    = 0.5
        ag_unguided  = 0.25
        cruise       = 2.0
        ss           = 2.0
        arad         = 2.0
        rocket_pod   = 1.0
        sidearm      = 1.0
    }

    // Classes exempt from the fighter-AG / attacker-AA doubling.
    DUMB_MUNITIONS
    {
        type = ag_unguided
        type = rocket_pod
    }

    // Runtime module fields resolve most munitions on their own (targetingType
    // gives you ARAD, missileType gives you bomb-vs-missile, engage flags give
    // you AA-vs-AG). These are the ones no field can tell you apart: cruise
    // missiles, surface-to-surface, cluster AA, and the Side Arm exception.
    // Key = part name exactly as it appears in the part cfg.
    CLASS_OVERRIDE
    {
        bahaAGM122     = sidearm
        // bahaTomahawk = cruise
        // <partname>  = aa_cluster
        // <partname>  = ss
    }
}
