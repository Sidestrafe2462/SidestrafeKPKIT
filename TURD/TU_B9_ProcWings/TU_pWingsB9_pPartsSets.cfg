// B9PW Type A & C

@PART[B9_Aero_Wing_Procedural_TypeA,B9_Aero_Wing_Procedural_TypeC]:FOR[100_Standardised_Switching]:NEEDS[TexturesUnlimited&B9_Aerospace_WingStuff&ProceduralParts]
{
    @MODULE[KSPTextureSwitch],0
    {
        textureSet = Smooth-Metal-Solid-Surface
    }
	@MODULE[KSPTextureSwitch],1
    {
        textureSet = Smooth-Metal-Solid-Leading
    }
	@MODULE[KSPTextureSwitch],2
    {
        textureSet = Smooth-Metal-Solid-Trailing
	}
	@MODULE[KSPTextureSwitch],3
    {
        textureSet = Smooth-Metal-Solid-Endplate
    }
}

// B9PW Type B

@PART[B9_Aero_Wing_Procedural_TypeB]:FOR[100_Standardised_Switching]:NEEDS[TexturesUnlimited&B9_Aerospace_WingStuff&ProceduralParts]
{
	@MODULE[KSPTextureSwitch],0
    {
        textureSet = Smooth-Metal-Solid-Surface
    }
	@MODULE[KSPTextureSwitch],1
    {
        textureSet = Smooth-Metal-Solid-Frame
    }
	@MODULE[KSPTextureSwitch],2
    {
        textureSet = Smooth-Metal-Solid-Edge
    }
}