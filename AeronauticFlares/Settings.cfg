// Visual flares for BDArmory. Edit and restart KSP.
AERONAUTIC_FLARES
{
    enabled = true
    // Streak left behind while the flare is fast; fades as it slows
    trail = true
    // Multiplies the flame, its halo and the flare's light
    brightness = 1
    // Multiplies the flame's physical radius
    flameScale = 1
    // Radius in pixels (at 1440p) kept by the halo and the flame at full brightness, however far away
    glarePixels = 420
    corePixels = 44
    // Colour multiplier over 1 so the flame's heart saturates to white
    gain = 4
    // How far the white-hot core streams back from the grain in the airstream (0: a round core); more by day
    flameStreak = 3
    // Narrowest the trail is drawn, pixels at 1440p
    trailPixels = 5
    // The flare's light on the aircraft and ground around it: intensity at full brightness, and reach in metres
    lightIntensity = 6
    lightRange = 80
    // Out to this distance (m) a flare keeps its full pixel size; past it the glare shrinks as 1/sqrt(distance), down to farShare
    fullSizeDistance = 25
    farShare = 0.5
    // How much overlapping halos on screen dim each other, so a salvo seen from afar does not add up to white
    overlapDim = 0.5
    // Seconds before the end of its life over which a flare burns out, dimming to nothing (0: cuts off)
    fadeSeconds = 0.8
    // What the halo, the flame's size and the light shrink to in full daylight, as a share of their night values
    dayGlare = 0.45
    dayCore = 0.8
    dayLight = 0.1
    // Chaff: a faint cloud that glints, in place of BDArmory's sprite
    chaff = true
    // Multiplies the cloud's haze and glints
    chaffBrightness = 1
    // How long a cloud hangs in the air (s), and how many glints it has
    chaffSeconds = 20
    // Over the last this many seconds of its life a cloud thins away to nothing
    chaffFadeSeconds = 7
    chaffGlints = 240
    // How near square to the sun's mirror direction a fibre glints (radians): wider than the sun, so a cloud twinkles
    chaffGlintWidth = 0.05
    // The air's turbulence (m2/s3), which spreads a cloud
    turbulence = 0.003
}
